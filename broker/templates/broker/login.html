<!DOCTYPE html>
{% load static %}
<html lang="en">
    

<head>
        
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="csrf-token" content="V6tAS9Bob7xo87mhNEMNhqYLDT6DYytrmUQ6FLc5">
        <title>Tesla Fx | User Login</title>
        
        
        <link rel="icon" href="{% static 'images/favicon.png' %}" type="image/png"/>
                   
            <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
            <!-- Icons -->
            <link href="{% static 'css/materialdesignicons.min.css' %}" rel="stylesheet" type="text/css" />
        
            <link rel="stylesheet" href="{% static 'css/line.css' %}">
            
            <!-- Main Css -->
            <link href="{% static 'css/style.css' %}" rel="stylesheet" type="text/css" />
            <link href="{% static 'css/default.css' %}" rel="stylesheet">
        

    </head>
    <body class="h-100 bg-soft-primary">
       <section class=" auth">
        <div class="container">
            <div class="pb-3 row justify-content-center">

                <div class="col-12 col-md-6 col-lg-6 col-sm-10 col-xl-6">
                    <a href="{% url 'index' %}"><img src="storage/app/public/photos/FSiuGxTesla Fx.png1778681507" alt="" class="mb-3 img-fluid auth__logo"></a>
                    
                                                                    <div class="bg-white shadow card login-page roundedd border-1 ">
                        <div class="card-body">
                            <h4 class="text-center card-title">User Login</h4>
                            <form method="POST" action="#"  class="mt-4 login-form">
                                {% csrf_token %}
                                                               <div class="row">
                                    <div class="col-lg-12">
                                        <div class="form-group">
                                            <label>Your Email Or UserName <span class="text-danger">*</span></label>
                                            <div class="position-relative">
                                                <i data-feather="mail" class="fea icon-sm icons"></i>
                                                <input type="username" class="pl-5 form-control" name ="username" value="" id="username" placeholder=" " required>
                                            </div>
                                        </div>
                                    </div>
                                    <!--end col-->

                                    <div class="col-lg-12">
                                        <div class="form-group">
                                            <label>Password <span class="text-danger">*</span></label>
                                            <div class="position-relative">
                                                <i data-feather="key" class="fea icon-sm icons"></i>
                                                <input type="password" class="pl-5 form-control" name="password" id="password" placeholder="Enter Password" required>
                                            </div>
                                        </div>
                                    </div>
                                    <!--end col-->

                                    <div class="col-lg-12">
                                        <div class="d-flex justify-content-between">
                                            <div class="form-group">
                                                <div class="custom-control custom-checkbox">
                                                    <input type="checkbox" class="custom-control-input"
                                                        id="customCheck1" name="remember">
                                                    <label class="custom-control-label" for="customCheck1">Remember
                                                        me</label>
                                                </div>
                                            </div>
                                            <p class="mb-0 forgot-pass"><a href="#"
                                                    class="text-dark font-weight-bold">Forgot password ?</a></p>
                                        </div>
                                    </div>
                                    <!--end col-->

                                    <div class="mb-0 col-lg-12">
                                        <button class="btn btn-primary btn-block pad" type="submit">Sign in</button>
                                    </div>
                                    <!--end col-->
                                    {% for message in messages %}
                                    <p id="messages">{{message}}</p>
                                    <div class="mt-4 text-center col-lg-12">
                                                                            </div>
                                    <!--end col-->
                                    <!--end col-->

                                    <div class="text-center col-12"> 
                                    <p class="mt-3 mb-0"><small class="mr-2 text-dark">Don't have an account
                                                ?</small> <a href="{% url 'register' %}"
                                                class="text-dark font-weight-bold">Sign Up</a></p>
                                                <br>
                                    <a href="https://infinitegrowthbridge.com/terms"
                                                class="text-dark">Terms and conditions</a>
                                    </div>
                                    <!--end col-->
                                    
                                    <div class="text-center col-12">
                                        <p class="mt-4 mb-0"><small class="mr-2 text-dark">&copy; Copyright  2026 &nbsp; Tesla Fx &nbsp; All Rights Reserved.</small>
                                        </p>
                                    </div>
                                </div>
                                <!--end row-->
                            </form>
                        </div>
                    </div>
                    <!---->
                </div>
                


                <!--end col-->
            </div>
            <!--end row-->
        </div>
        <!--end container-->
    </section>
    <!--end section-->




                 <script src="{% static 'js/jquery-3.5.1.min.js' %}"></script>
            <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
            
            <!-- SLIDER -->
            <script src="{% static 'js/owl.carousel.min.js' %}"></script>
            <script src="{% static 'js/owl.init.js' %}"></script>
            <!-- Icons -->
            <script src="{% static 'js/feather.min.js' %}"></script>
            <script src="{% static 'js/bundle' %}"></script>
            
            <script src="{% static 'js/app.js' %}"></script>
            <script src="{% static 'js/widget.js' %}"></script>
       
            <script>window.gtranslateSettings = {"default_language":"en","detect_browser_language":true,"wrapper_selector":".gtranslate_wrapper"}</script>
            <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

    </body>
    {% endfor %}
        </html>
